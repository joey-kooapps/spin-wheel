<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Spin Wheel</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-muted: #f7f9fb;
      --surface-strong: #edf4ff;
      --border: #d9e0e8;
      --border-strong: #a8b5c5;
      --text: #18212f;
      --muted: #667386;
      --primary: #1769e0;
      --primary-dark: #0f55bc;
      --primary-soft: #e8f1ff;
      --danger: #c93535;
      --danger-soft: #fff0f0;
      --success: #147a54;
      --success-soft: #e7f6ef;
      --warning: #8c5b00;
      --warning-soft: #fff6dc;
      --shadow: 0 14px 32px rgba(23, 35, 52, 0.12);
      --radius: 8px;
      --focus: 0 0 0 3px rgba(23, 105, 224, 0.18);
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    * { box-sizing: border-box; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(280px, 320px) minmax(440px, 1fr) minmax(280px, 320px);
      grid-template-areas: "left main right";
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
    }

    .sidebar {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface-muted);
      min-height: 0;
    }
    .sidebar.left {
      grid-area: left;
      border-right: 1px solid var(--border);
    }
    .sidebar.right {
      grid-area: right;
      border-left: 1px solid var(--border);
    }
    .sidebar-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }
    .sidebar-scroll::-webkit-scrollbar,
    .item-list-container::-webkit-scrollbar { width: 10px; }
    .sidebar-scroll::-webkit-scrollbar-thumb,
    .item-list-container::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border: 3px solid transparent;
      border-radius: 999px;
      background-clip: content-box;
    }

    .datasets-header,
    .history-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .datasets-header h3,
    .history-header h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: 0;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: 160px;
      padding: 0 8px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--primary-soft);
      font-size: 12px;
      color: var(--primary-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .datasets-content,
    .history-content { padding: 12px; }

    .dataset-row {
      display: grid;
      grid-template-rows: auto auto;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(24, 33, 47, 0.04);
    }
    .dataset-row.active {
      border-color: rgba(23, 105, 224, 0.5);
      box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.10);
    }
    .dataset-bottom {
      display: grid;
      grid-template-columns: minmax(58px, 1fr) repeat(3, minmax(58px, 0.9fr));
      gap: 6px;
      align-items: center;
    }
    .dataset-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }
    .dataset-info {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 30px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-muted);
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 8px;
    }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .footer-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button,
    .footer-btn,
    input[type="text"],
    input[type="number"] {
      min-height: 38px;
      font: inherit;
      font-size: 14px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
    }
    button,
    .footer-btn {
      padding: 0 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, transform 120ms ease;
    }
    button:hover:not(:disabled),
    .footer-btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary-dark);
    }
    button:active:not(:disabled),
    .footer-btn:active { transform: translateY(1px); }
    button:focus-visible,
    .footer-btn:focus-within,
    input:focus-visible {
      outline: none;
      box-shadow: var(--focus);
      border-color: var(--primary);
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 0 11px;
      background: var(--surface);
    }
    input::placeholder { color: #8b97a8; }
    .btn {
      width: 100%;
      min-height: 30px;
      height: 30px;
      padding: 0 8px;
      font-size: 12px;
    }
    .btn.primary {
      border-color: rgba(23, 105, 224, 0.45);
      background: var(--primary-soft);
      color: var(--primary-dark);
    }
    .btn.danger {
      border-color: #efb6b6;
      background: var(--danger-soft);
      color: var(--danger);
    }
    .footer-btn {
      min-height: 38px;
      border-style: dashed;
      border-color: rgba(23, 105, 224, 0.45);
      background: var(--primary-soft);
      color: var(--primary-dark);
      border-radius: var(--radius);
    }
    .footer-btn input[type="file"] { display:none; }

    .history-controls {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .history-controls button {
      min-height: 30px;
      padding: 0 8px;
      font-size: 12px;
    }
    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      margin-bottom: 8px;
      font-size: 13px;
      line-height: 1.35;
      box-shadow: 0 1px 2px rgba(24, 33, 47, 0.04);
    }
    .history-item .time {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .content {
      grid-area: main;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      overflow: hidden;
    }
    .center-inner {
      width: min(100%, 1120px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 22px clamp(16px, 2.4vw, 28px) 24px;
      height: 100%;
      min-height: 0;
    }

    .wheel-section {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .wheel-container {
      position: relative;
      width: clamp(280px, min(48vh, 46vw), 640px);
      aspect-ratio: 1;
      cursor: grab;
      touch-action: none;
      filter: drop-shadow(var(--shadow));
    }
    .wheel-container.grabbing { cursor: grabbing; }
    .pointer {
      position: absolute;
      top: 50%;
      right: -22px;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      border-right: 24px solid var(--text);
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(24, 33, 47, 0.22));
    }
    #wheelCanvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .controls-row {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: min(100%, 720px);
    }
    .spin-button {
      min-width: 120px;
      min-height: 44px;
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
      font-weight: 750;
      box-shadow: 0 10px 20px rgba(23, 105, 224, 0.22);
    }
    .spin-button:hover:not(:disabled) {
      background: var(--primary-dark);
      color: #fff;
    }
    .filter-input { flex: 1 1 220px; max-width: 320px; }
    .filter-summary {
      width: 100%;
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    #winnerDisplay {
      margin-top: 12px;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border-radius: 999px;
      color: var(--muted);
      font-weight: 700;
      text-align: center;
    }
    #winnerDisplay.has-winner {
      background: var(--success-soft);
      color: var(--success);
      border: 1px solid rgba(20, 122, 84, 0.25);
    }
    #winnerDisplay.is-warning {
      background: var(--warning-soft);
      color: var(--warning);
      border: 1px solid rgba(140, 91, 0, 0.25);
    }

    .items-section {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 0;
      margin-top: 16px;
    }
    .add-item-container {
      width: min(100%, 920px);
      margin: 0 auto 10px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) minmax(150px, 1fr) minmax(92px, 120px) minmax(104px, 124px);
      gap: 10px;
      align-items: center;
    }
    .form-status {
      min-height: 20px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .form-status.is-error { color: var(--danger); }
    .form-status.is-success { color: var(--success); }
    .item-list-container {
      flex: 1 1 auto;
      min-height: 160px;
      width: min(100%, 920px);
      position: relative;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      overflow-y: auto;
      overflow-x: hidden;
      background: rgba(255, 255, 255, 0.88);
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }
    .item-row {
      display: grid;
      grid-template-columns: minmax(140px, 1fr) minmax(140px, 1fr) minmax(88px, 110px) minmax(84px, 96px);
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
      width: 100%;
    }
    .item-row:last-child { margin-bottom: 0; }
    .delete-btn {
      background: var(--surface);
      color: var(--danger);
      border-color: #efb6b6;
    }
    .empty-state {
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
      padding: 18px;
      background: var(--surface-muted);
      font-size: 14px;
      line-height: 1.45;
    }
    .empty-state.compact {
      min-height: 80px;
      font-size: 13px;
    }

    @media (max-width: 1180px) {
      html, body { overflow: auto; height: auto; }
      .shell {
        width: 100%;
        min-height: 100vh;
        height: auto;
        overflow: visible;
        grid-template-columns: minmax(260px, 320px) minmax(420px, 1fr);
        grid-template-rows: auto auto;
        grid-template-areas:
          "left main"
          "right right";
      }
      .sidebar {
        min-height: 0;
        max-height: none;
      }
      .sidebar.left { border-right: 1px solid var(--border); }
      .sidebar.right {
        border-left: 0;
        border-top: 1px solid var(--border);
      }
      .content {
        min-height: 760px;
      }
      .wheel-container {
        width: clamp(280px, min(44vh, 52vw), 560px);
      }
      .sidebar-scroll,
      .item-list-container { max-height: none; }
    }

    @media (max-width: 780px) {
      .shell {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-areas:
          "main"
          "left"
          "right";
      }
      .content {
        min-height: 0;
        overflow: visible;
      }
      .center-inner {
        height: auto;
        padding: 18px 14px;
      }
      .sidebar.left,
      .sidebar.right {
        border-left: 0;
        border-right: 0;
        border-top: 1px solid var(--border);
      }
      .wheel-container {
        width: min(82vw, 430px);
      }
      .pointer {
        right: -16px;
        border-top-width: 12px;
        border-bottom-width: 12px;
        border-right-width: 18px;
      }
      .controls-row {
        align-items: stretch;
      }
      .spin-button,
      .filter-input,
      .controls-row button {
        flex: 1 1 100%;
        max-width: none;
      }
      .form-grid,
      .item-row {
        grid-template-columns: 1fr;
      }
      .item-list-container {
        min-height: 220px;
      }
      .dataset-bottom {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <!-- LEFT: Datasets -->
    <aside class="sidebar left">
      <div class="datasets-header">
        <h3>Datasets</h3>
        <span class="badge" id="activeDatasetBadge">Active: -</span>
      </div>

      <div class="sidebar-scroll">
        <div class="datasets-content">
          <div id="datasetList"></div>
        </div>
      </div>

      <!-- Footer: Add + Import (same style) -->
      <div class="sidebar-footer">
        <div class="footer-row">
          <button class="footer-btn" type="button" onclick="addDataset()" aria-label="Add dataset">+ Add</button>
          <label class="footer-btn" title="Import dataset JSON" aria-label="Import dataset JSON">
            Import JSON
            <input type="file" accept=".json" onchange="importData(event)" />
          </label>
        </div>
      </div>
    </aside>

    <!-- CENTER: Wheel + Items -->
    <main class="content">
      <div class="center-inner">
        <section class="wheel-section">
          <div class="wheel-container" id="wheelContainer">
            <canvas id="wheelCanvas" role="img" aria-label="Spin wheel showing the current filtered item pool" aria-describedby="wheelHelp"></canvas>
            <div class="pointer"></div>
          </div>
          <div id="wheelHelp" class="sr-only">Drag or flick the wheel, or use the Spin button, to choose a winner.</div>

          <div class="controls-row">
            <button id="spinButton" class="spin-button" type="button" onclick="spinWheel()">Spin</button>
            <label class="sr-only" for="filterTags">Filter tags</label>
            <input class="filter-input" type="text" id="filterTags" placeholder="Filter tags..." aria-describedby="filterSummary" />
            <button type="button" onclick="applyFilter()">Filter</button>
            <button type="button" onclick="clearFilter()">Clear</button>
            <div class="filter-summary" id="filterSummary" aria-live="polite"></div>
          </div>
          <div id="winnerDisplay" role="status" aria-live="polite"></div>
        </section>

        <section class="items-section">
          <div class="add-item-container">
            <form class="form-grid" onsubmit="addItem(); return false;" autocomplete="off">
              <label class="sr-only" for="newItemName">New item name</label>
              <input type="text" id="newItemName" placeholder="Item name" aria-describedby="formStatus" />
              <label class="sr-only" for="newItemTags">New item tags</label>
              <input type="text" id="newItemTags" placeholder="Tags, comma separated" />
              <label class="sr-only" for="newItemWeight">New item weight</label>
              <input type="number" id="newItemWeight" placeholder="Weight" min="0.0001" step="0.01" />
              <button type="submit">Add Item</button>
            </form>
            <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>
          </div>
          <div class="item-list-container" aria-live="polite">
            <div class="item-list" id="itemList"></div>
          </div>
        </section>
      </div>
    </main>

    <!-- RIGHT: History -->
    <aside class="sidebar right">
      <div class="history-header">
        <h3>History</h3>
        <div class="history-controls">
          <button type="button" onclick="clearHistory()">Clear History</button>
          <button type="button" onclick="exportHistory()">Export</button>
        </div>
      </div>
      <div class="sidebar-scroll">
        <div class="history-content" id="historyContent"></div>
      </div>
    </aside>
  </div>

  <script>
    /************ DATASETS MODEL ************/
    const LS_DATASETS = 'spinWheelDatasets';
    const LS_ACTIVE_DATASET_ID = 'spinWheelActiveDatasetId';
    // Dataset: { id, name, items, currentId, history }

    let datasets = [];
    let activeDatasetId = null;

    const newId = () => (crypto.randomUUID ? crypto.randomUUID() : 'ds_' + Math.random().toString(36).slice(2));

    function saveDatasets() {
      try { localStorage.setItem(LS_DATASETS, JSON.stringify(datasets)); } catch {}
      try { localStorage.setItem(LS_ACTIVE_DATASET_ID, JSON.stringify(activeDatasetId)); } catch {}
    }

    function loadDatasets() {
      const rawDs = localStorage.getItem(LS_DATASETS);
      const rawActive = localStorage.getItem(LS_ACTIVE_DATASET_ID);

      if (rawDs) { try { datasets = JSON.parse(rawDs) || []; } catch { datasets = []; } }
      if (rawActive) { try { activeDatasetId = JSON.parse(rawActive) || null; } catch { activeDatasetId = null; } }

      // Migrate legacy single dataset if present
      const legacyData = localStorage.getItem('spinWheelData');
      const legacyHistory = localStorage.getItem('spinWheelHistory');
      if (!datasets.length && (legacyData || legacyHistory)) {
        let items = []; let currentId = 0; let history = [];
        try { if (legacyData) { const d = JSON.parse(legacyData); items = Array.isArray(d.items) ? d.items : []; currentId = d.currentId || 0; } } catch {}
        try { if (legacyHistory) { const h = JSON.parse(legacyHistory); history = Array.isArray(h) ? h : []; } } catch {}
        const ds = { id: newId(), name: 'Default', items, currentId, history };
        datasets.push(ds); activeDatasetId = ds.id;
        localStorage.removeItem('spinWheelData'); localStorage.removeItem('spinWheelHistory');
        saveDatasets();
      }

      // Ensure at least one dataset exists
      if (!datasets.length) {
        const ds = { id: newId(), name: 'Default', items: [], currentId: 0, history: [] };
        datasets.push(ds); activeDatasetId = ds.id; saveDatasets();
      }

      if (!datasets.find(d => d.id === activeDatasetId)) {
        activeDatasetId = datasets[0].id; saveDatasets();
      }
    }

    function getActiveDataset() { return datasets.find(d => d.id === activeDatasetId); }

    function setActiveDataset(id) {
      const ds = datasets.find(d => d.id === id);
      if (!ds) return;

      activeDatasetId = id;

      items = (ds.items || []).map(it => ({
        id: it.id, name: it.name,
        tags: cleanTagsArray(it.tags),
        weight: sanitizeWeight(it.weight ?? 1, 1)
      }));
      currentId = Math.max(ds.currentId || 0, items.reduce((m,it)=>Math.max(m, it.id||0), 0) + 1);
      history = Array.isArray(ds.history) ? ds.history : [];

      saveDatasets();
      setFormStatus('');
      setWinnerMessage('');
      renderDatasetsList();
      renderHistory();
      renderItemList();
      drawWheel();

      document.getElementById('activeDatasetBadge').textContent = 'Active: ' + (ds.name || '-');
    }

    function updateActiveDatasetSnapshot() {
      const ds = getActiveDataset();
      if (!ds) return;
      ds.items = items;
      ds.currentId = currentId;
      ds.history = history;
      saveDatasets();
      // no forced re-render here to preserve dataset input focus UX
    }

    function addDatasetFromImport(name, imported) {
      const cleanedItems = (imported.items || []).map(it => ({
        id: it.id, name: it.name,
        tags: cleanTagsArray(it.tags),
        weight: sanitizeWeight(it.weight ?? 1, 1)
      }));
      const maxId = cleanedItems.reduce((m, it) => Math.max(m, it.id || 0), 0);
      const ds = {
        id: newId(),
        name: name || 'Imported',
        items: cleanedItems,
        currentId: Math.max(imported.currentId || 0, maxId + 1),
        history: []
      };
      datasets.unshift(ds);
      activeDatasetId = ds.id;
      saveDatasets();
      setActiveDataset(ds.id);
      renderDatasetsList();
    }

    /* Inline rename without re-render (prevents focus loss) */
    function renameDatasetInline(id, newName) {
      const ds = datasets.find(d => d.id === id);
      if (!ds) return;
      ds.name = newName || 'Untitled';
      saveDatasets();
      if (id === activeDatasetId) {
        document.getElementById('activeDatasetBadge').textContent = 'Active: ' + ds.name;
      }
    }

    function addDataset() {
      const index = datasets.length + 1;
      const ds = { id: newId(), name: `Dataset ${index}`, items: [], currentId: 0, history: [] };
      datasets.unshift(ds);
      saveDatasets();
      setActiveDataset(ds.id);
      renderDatasetsList();
      setTimeout(() => {
        const input = document.querySelector(`.dataset-name[data-dsid="${ds.id}"]`);
        if (input) { input.focus(); input.select(); }
      }, 0);
    }

    function exportDataset(dsId) {
      const ds = datasets.find(d => d.id === dsId);
      if (!ds) return;
      const payload = { currentId: ds.currentId || 0, items: ds.items || [] };
      const dataStr = JSON.stringify(payload, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);

    function deleteDataset(dsId) {

    /************ APP STATE ************/
    let items = [];

    /************ UTILS ************/
    function nowStr() { return new Date().toLocaleString(); }
    function plural(count, word) { return `${count} ${word}${count === 1 ? '' : 's'}`; }

    function pushHistory(type, payload = {}) {
      history.unshift({ id: crypto.randomUUID?.() ?? String(Math.random()), time: nowStr(), type, payload });

    function sanitizeWeight(val, fallback = 1) {
      let w = Number(val);

    function normalizeTag(tag) {

    function cleanTagsArray(tags) {

      tags.forEach(tag => {

    function getPointerAngle(evt) {

      const y = (evt.clientY ?? evt.touches?.[0]?.clientY) - rect.top;

    /* Live-update the active dataset's info pill without re-rendering the list */

    /************ Items ************/
    function addItem() {
      const nameInput = document.getElementById('newItemName');

    }
    function updateItemName(id, newName) {
      const idx = items.findIndex(i => i.id === id);
      if (idx !== -1) {

    }
    function updateItemTags(id, tagsString) {
      const newTags = parseTags(tagsString);

        refreshUiState();
      }
    }
    function updateItemWeight(id, weightVal) {
      const idx = items.findIndex(i => i.id === id);
      if (idx !== -1) {
        const raw = String(weightVal ?? '').trim();
        if (!raw) return;
        const w = Number(raw);
        if (!isFinite(w) || w <= 0) return;
        items[idx].weight = w;
        updateActiveDatasetSnapshot(); drawWheel();
        refreshUiState();

    }
    function editKey(id, field) {
      return `${id}:${field}`;
    }
    function itemFieldValue(item, field) {
      if (field === 'tags') return [...(item.tags || [])];
      if (field === 'weight') return sanitizeWeight(item.weight ?? 1, 1);
      return item.name || '';
    }
    function beginItemEdit(id, field) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      editBaselines.set(editKey(id, field), itemFieldValue(item, field));
    }
    function commitItemEdit(id, field, inputEl) {
      const item = items.find(i => i.id === id);
      if (!item) return;

      const key = editKey(id, field);
      const baseline = editBaselines.has(key) ? editBaselines.get(key) : itemFieldValue(item, field);
      editBaselines.delete(key);

      if (field === 'name') {
        const from = String(baseline || '');
        const to = String(item.name || '').trim();
        if (!to.trim()) {
          item.name = from || 'Untitled item';

          updateActiveDatasetSnapshot(); drawWheel(); refreshUiState();

        item.name = to;

      if (field === 'tags') {
        const from = Array.isArray(baseline) ? baseline : [];

        const parsed = Number(raw);
        if (!raw || !isFinite(parsed) || parsed <= 0) {

    function deleteItem(id) {

    /************ Filter ************/

    function matchesFilter(item) {

    /************ Render list ************/

    /************ Drawing (weighted wheel) ************/
    function canvasCssSize() {
      const rect = canvas.getBoundingClientRect();
      return { width: rect.width || canvas.width, height: rect.height || canvas.height };
    }
    function truncateCanvasText(text, maxWidth) {
      const label = String(text || 'Untitled item');
      if (ctx.measureText(label).width <= maxWidth) return label;
      let truncated = label;
      while (truncated.length > 1 && ctx.measureText(`${truncated}...`).width > maxWidth) {
        truncated = truncated.slice(0, -1);
      }
      return `${truncated.trim()}...`;
    }
    function drawWheel() {
      const visibleItems = getVisibleItems();
      const { width, height } = canvasCssSize();
      ctx.clearRect(0, 0, width, height);

      const cx = width / 2, cy = height / 2;
      const radius = Math.max(1, Math.min(width, height) / 2 - 4);

      if (!visibleItems.length) {
        ctx.beginPath(); ctx.arc(cx, cy, radius, 0, 2*Math.PI);
        ctx.fillStyle = '#f4f7fb'; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#d9e0e8'; ctx.stroke();
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#667386'; ctx.font = '700 18px Arial, sans-serif';
        ctx.fillText(items.length ? 'No matches' : 'No items yet', cx, cy - 8);
        ctx.font = '13px Arial, sans-serif';
        ctx.fillText(items.length ? 'Change or clear the filter' : 'Add items below', cx, cy + 16);
        return;
      }

      const weights = visibleItems.map(i => sanitizeWeight(i.weight ?? 1, 1));
      const totalWeight = weights.reduce((a,b)=>a+b, 0); if (totalWeight <= 0) return;

      let start = rotationAngle;
      for (let i = 0; i < visibleItems.length; i++) {
        const span = (2*Math.PI) * (weights[i] / totalWeight);
        const startAngle = start, endAngle = start + span;

        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, startAngle, endAngle);
        ctx.fillStyle = getSegmentColor(i, visibleItems.length); ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();

        const mid = (startAngle + endAngle) / 2;
        if (span > 0.09 && radius > 90) {
          const angle = ((mid % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
          const maxWidth = Math.max(42, radius * 0.42);
          ctx.save(); ctx.translate(cx, cy); ctx.rotate(mid);
          ctx.fillStyle = '#18212f'; ctx.font = '700 13px Arial, sans-serif';
          ctx.textBaseline = 'middle';
          if (angle > Math.PI / 2 && angle < 3 * Math.PI / 2) {
            ctx.rotate(Math.PI);
            ctx.textAlign = 'left';
            ctx.fillText(truncateCanvasText(visibleItems[i].name, maxWidth), -radius + 18, 0);
          } else {
            ctx.textAlign = 'right';
            ctx.fillText(truncateCanvasText(visibleItems[i].name, maxWidth), radius - 18, 0);
          }
          ctx.restore();
        }

        start += span;
      }

      ctx.beginPath(); ctx.arc(cx, cy, Math.max(18, radius * 0.08), 0, 2*Math.PI);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#d9e0e8'; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, radius, 0, 2*Math.PI);
      ctx.lineWidth = 2; ctx.strokeStyle = '#18212f'; ctx.stroke();
    }
    function getSegmentColor(i, total) {
      const palette = ['#7ab8ff', '#f4c95d', '#73c6a3', '#f28b82', '#b39ddb', '#ffad66', '#9ad1d4', '#f6a6c9'];
      if (total <= palette.length) return palette[i % palette.length];
      return `hsl(${(i * 137.508) % 360}, 68%, 70%)`;
    }

    /************ Spinning (time-based inertia) ************/
    let lastAnimTime = null;
    function animateSpin(ts) {
      if (!spinning) { rafId = null; return; }
      if (lastAnimTime == null) { lastAnimTime = ts; rafId = requestAnimationFrame(animateSpin); return; }

      const dt = Math.max(0, (ts - lastAnimTime) / 1000);
      lastAnimTime = ts;

      rotationAngle = (rotationAngle + spinVelocity * dt) % (2*Math.PI);
      const decay = Math.pow(DECAY_PER_SECOND, dt);
      spinVelocity *= decay;

      drawWheel();

      if (Math.abs(spinVelocity) > MIN_VELOCITY_RAD_S) {
        rafId = requestAnimationFrame(animateSpin);
      } else {
        spinning = false; spinVelocity = 0; lastAnimTime = null; rafId = null;
        updateSpinButtonState();
        if (!suppressPick) pickWinner();
        suppressPick = false;
      }
    }

    function spinWheel() {
      const visibleItems = getVisibleItems();
      if (!visibleItems.length) {
        setWinnerMessage(items.length ? 'No items match the current filter.' : 'Add items before spinning.', 'warning');
        updateSpinButtonState();
        return;
      }
      if (spinning) return;

      suppressPick = false; spinning = true;
      setWinnerMessage('');
      setFormStatus('');
      updateSpinButtonState();

      rotationAngle = Math.random() * 2 * Math.PI;
      spinVelocity = BUTTON_START_V_RAD_S;
      lastAnimTime = null;
      rafId = requestAnimationFrame(animateSpin);
    }

    /************ Winner (weighted mapping) ************/
    function pickWinner() {
      const visibleItems = getVisibleItems();
      if (!visibleItems.length) { setWinnerMessage('No winner because the wheel has no visible items.', 'warning'); return; }

      const weights = visibleItems.map(i => sanitizeWeight(i.weight ?? 1, 1));
      const totalWeight = weights.reduce((a,b)=>a+b, 0);

      let localAngle = (-rotationAngle % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);

      let cum = 0, idx = 0;
      for (let i = 0; i < visibleItems.length; i++) {
        const span = (2*Math.PI) * (weights[i] / totalWeight);
        if (localAngle >= cum && localAngle < cum + span) { idx = i; break; }
        cum += span;
      }

      const winner = visibleItems[idx];
      setWinnerMessage(`Winner: ${winner.name}`, 'winner');
      pushHistory('spin', {
        winner: winner.name,
        weight: sanitizeWeight(winner.weight ?? 1, 1),
        tags: [...(winner.tags || [])],
        filteredBy: [...activeFilterTags],
        poolCount: visibleItems.length,
        totalWeight: totalWeight
      });
    }

    /************ Drag / Flick (cancel-on-hold + speed gating) ************/
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      wasSpinningBeforeDrag = spinning;

      if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
      if (wasSpinningBeforeDrag) suppressPick = true;

      spinning = false; spinVelocity = 0; lastAnimTime = null;
      updateSpinButtonState();

      isDragging = true; velocitySamples = [];
      lastPointerAngle = getPointerAngle(e);
      lastSignificantMoveTs = performance.now();
      wheelContainer.classList.add('grabbing');
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      e.preventDefault();

      const ang = getPointerAngle(e);
      if (lastPointerAngle == null) { lastPointerAngle = ang; return; }

      let d = normAngleDelta(ang - lastPointerAngle);
      rotationAngle = (rotationAngle + d) % (2 * Math.PI);
      drawWheel();

      const now = performance.now();
      if (Math.abs(d) >= MOVE_EPS) lastSignificantMoveTs = now;

      velocitySamples.push({ t: now, dAngle: d });
      const cutoff = now - VELOCITY_WINDOW_MS;
      while (velocitySamples.length && velocitySamples[0].t < cutoff) velocitySamples.shift();

      lastPointerAngle = ang;
    });

    function endDrag(e) {
      if (!isDragging) return;
      e && e.preventDefault();

      isDragging = false;
      wheelContainer.classList.remove('grabbing');
      lastPointerAngle = null;

      const now = performance.now();
      const heldLongEnough = (now - lastSignificantMoveTs) >= HOLD_TO_CANCEL_MS;

      if (!velocitySamples.length) {
        if (wasSpinningBeforeDrag) { suppressPick = false; pickWinner(); }
        updateSpinButtonState();
        return;
      }

      const firstT = velocitySamples[0].t;
      const lastT  = velocitySamples[velocitySamples.length - 1].t;
      const totalMs = Math.max(1, lastT - firstT);
      const netAngle = velocitySamples.reduce((s, smp) => s + smp.dAngle, 0);
      const vWindow = (netAngle / totalMs) * 1000; // rad/s

      let vInstant = 0;
      if (velocitySamples.length >= 2) {
        const a = velocitySamples[velocitySamples.length - 2];
        const b = velocitySamples[velocitySamples.length - 1];
        const dt = Math.max(1, b.t - a.t);
        vInstant = (b.dAngle / dt) * 1000;
      } else { vInstant = vWindow; }

      // Cancel if held and not moving fast
      if (!wasSpinningBeforeDrag && heldLongEnough && Math.abs(vInstant) < 0.25) { updateSpinButtonState(); return; }
      if (wasSpinningBeforeDrag && heldLongEnough && Math.abs(vInstant) < 0.25) { suppressPick = false; pickWinner(); updateSpinButtonState(); return; }

      const shouldStartInertia = (Math.abs(vInstant) >= 0.50) && (Math.abs(vWindow) >= 0.50);

      if (!shouldStartInertia) {
        if (wasSpinningBeforeDrag) { suppressPick = false; pickWinner(); }
        updateSpinButtonState();
        return;
      }

      suppressPick = false;
      spinVelocity = vWindow;
      spinning = true;
      setWinnerMessage('');
      updateSpinButtonState();
      lastAnimTime = null;
      rafId = requestAnimationFrame(animateSpin);
    }

    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('pointerleave', (e) => {
      if (isDragging && !canvas.hasPointerCapture?.(e.pointerId)) endDrag(e);
    });

    /************ Import (footer) ************/
    function importData(event) {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported && Array.isArray(imported.items)) {
            const base = (file.name || 'Imported').replace(/\.[^/.]+$/, '');
            addDatasetFromImport(base, imported);
            setFormStatus(`Imported ${plural(imported.items.length, 'item')} from ${file.name}.`, 'success');
            pushHistory('import_items', { itemCount: imported.items.length, fileName: file.name });
          } else {
            setFormStatus('Invalid JSON format. Expected an object with an items array.', 'error');
          }
        } catch (err) {
          setFormStatus('Failed to parse JSON file.', 'error'); console.error(err);
        }
      };
      reader.readAsText(file); event.target.value = "";
    }

    /************ History (per dataset) ************/
    function clearHistory() {
      if (!confirm('Clear the entire history panel for this dataset?')) return;
      history = [];
      updateActiveDatasetSnapshot();
      renderHistory();
    }
    function exportHistory() {
      const dataStr = JSON.stringify(history, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a'); link.href = url; link.download = 'spinWheelHistory.json'; link.click();
      URL.revokeObjectURL(url);
    }
    function renderHistory() {
      historyContentEl.innerHTML = '';
      if (!history.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state compact';
        empty.textContent = 'No history yet. Spins and committed edits will appear here.';
        historyContentEl.appendChild(empty); return;
      }
      history.forEach(entry => {
        const div = document.createElement('div'); div.className = 'history-item';
        let title = '', details = '';
        switch (entry.type) {
          case 'spin':
            title = `Winner: ${entry.payload.winner}`;
            details = `Total weight: ${Number(entry.payload.totalWeight).toFixed(2)} | Pool: ${entry.payload.poolCount}`;
            if (entry.payload.filteredBy?.length) details += ` | Filter: ${entry.payload.filteredBy.join(', ')}`;
            if (entry.payload.weight != null) details += ` | Winner weight: ${entry.payload.weight}`;
            if (entry.payload.tags?.length) details += ` | Tags: ${entry.payload.tags.join(', ')}`;
            break;
          case 'add_item':
            title = `Added: ${entry.payload.name}`;
            details = `Weight: ${entry.payload.weight}` + (entry.payload.tags?.length ? ` | Tags: ${entry.payload.tags.join(', ')}` : '');
            break;
          case 'rename_item':
            title = `Renamed`; details = `${entry.payload.from} -> ${entry.payload.to}`; break;
          case 'update_tags':
            title = `Updated tags: ${entry.payload.name}`;
            details = (entry.payload.tags && entry.payload.tags.length) ? entry.payload.tags.join(', ') : 'None'; break;
          case 'update_weight':
            title = `Updated weight: ${entry.payload.name}`;
            details = `${entry.payload.from} -> ${entry.payload.to}`; break;
          case 'delete_item':
            title = `Deleted: ${entry.payload.name}`; break;
          case 'import_items':
            title = `Imported items`;
            details = `${entry.payload.itemCount ?? 0} items` + (entry.payload.fileName ? ` | ${entry.payload.fileName}` : ''); break;
          case 'export_items':
            title = `Exported items`; details = `${entry.payload.itemCount ?? 0} items`; break;
          case 'clear_items':
            title = `Cleared all items`; details = 'All current items removed'; break;
          default: title = entry.type;
        }
        const titleEl = document.createElement('div'); titleEl.textContent = title; div.appendChild(titleEl);
        if (details) { const detailsEl = document.createElement('div'); detailsEl.style.color = '#444'; detailsEl.style.marginTop = '2px'; detailsEl.textContent = details; div.appendChild(detailsEl); }
        const timeEl = document.createElement('div'); timeEl.className = 'time'; timeEl.textContent = entry.time; div.appendChild(timeEl);
        historyContentEl.appendChild(div);
      });
    }
  </script>
</body>
