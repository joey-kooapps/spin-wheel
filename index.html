<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Spin Wheel — Datasets 4-Column Actions (Live Count)</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden; /* columns manage their own scroll */
      -webkit-user-select: none; user-select: none;
    }

    /* ======= 3-column shell ======= */
    .shell {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #fff;
    }

    /* Left + Right sidebars */
    .sidebar {
      flex: 0 0 360px;   /* restored width */
      width: 360px;
      display: flex; flex-direction: column;
      background: #fafafa; box-sizing: border-box;
    }
    .sidebar.left  { border-right: 1px solid #ddd; }
    .sidebar.right { border-left: 1px solid #ddd; }
    .sidebar-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }

    /* ======= Left: datasets ======= */
    .datasets-header {
      padding: 12px; border-bottom: 1px solid #e5e5e5;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; background:#fff;
    }
    .datasets-header h3 { margin: 0; font-size: 16px; font-weight: bold; }
    .badge {
      display:inline-flex; align-items:center; justify-content:center;
      padding: 0 8px; height: 24px; border-radius: 4px; border: 1px solid #ddd;
      background: #f5f5f5; font-size: 12px; color: #333;
    }

    .datasets-content { padding: 10px; }

    /* 2-row dataset item */
    .dataset-row {
      display: grid;
      grid-template-rows: auto auto;  /* top name, bottom actions/info */
      gap: 6px;
      background: #fff;
      border: 1px solid #e6e6e6; border-radius: 8px;
      padding: 10px; margin-bottom: 10px;
    }
    .dataset-row.active {
      border-color: #4c9ffe; box-shadow: 0 0 0 2px rgba(76,159,254,0.15) inset;
    }

    .dataset-top { display: block; }
    .dataset-name {
      width: 100%; height: 34px; font-size: 14px; padding: 0 10px;
      box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; background: #fff;
    }

    .dataset-bottom {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr)); /* 4 equal columns */
      gap: 8px; align-items: center;
    }
    .dataset-cell { display:flex; align-items:center; justify-content:center; }

    .dataset-info {
      width: 100%;
      display:flex; align-items:center; justify-content:center;
      height: 30px; border-radius: 6px; border: 1px solid #ddd;
      background: #f5f5f5; font-size: 12px; color:#333;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      box-sizing: border-box; padding: 0 10px;
    }

    .btn {
      height: 30px; width: 100%;
      padding: 0 10px; font-size: 13px; border-radius: 6px; cursor: pointer;
      border: 1px solid #ccc; background: #fff; box-sizing: border-box;
    }
    .btn.primary { border-color: #8ab4ff; background: #eef6ff; color: #0a58ca; }
    .btn.danger  { border-color: #e2b4b4; background: #ffecec; color: #a40000; }
    .btn:disabled { opacity: 0.6; cursor: default; }

    /* Footer: Add + Import (identical style) */
    .sidebar-footer {
      padding: 10px; border-top: 1px solid #e5e5e5; background: #fff;
    }
    .footer-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .footer-btn {
      height: 36px; font-size: 14px; border-radius: 8px; cursor: pointer;
      border: 1px dashed #8ab4ff; background: #eef6ff; color: #0a58ca; text-align: center;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .footer-btn input[type="file"] { display:none; }

    /* ======= Right: history ======= */
    .history-header {
      padding: 12px; border-bottom: 1px solid #e5e5e5;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; background:#fff;
    }
    .history-header h3 { margin: 0; font-size: 16px; font-weight: bold; }
    .history-controls { display: flex; gap: 6px; }
    .history-controls button { height: 28px; font-size: 12px; padding: 0 8px; cursor: pointer; }
    .history-content { padding: 10px; }
    .history-item { background: #fff; border: 1px solid #e6e6e6; border-radius: 6px; padding: 8px; margin-bottom: 8px; font-size: 13px; line-height: 1.3; }
    .history-item .time { color: #666; font-size: 12px; margin-top: 4px; }

    /* ======= Center (no scrollbar) ======= */
    .content { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; background: #fff; overflow: hidden; }
    .center-inner {
      max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; align-items: center;
      padding: 20px 20px 24px; box-sizing: border-box; height: 100%;
    }

    .wheel-section { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; }
    .wheel-container { position: relative; width: 50vh; height: 50vh; max-width: 700px; max-height: 700px; cursor: grab; touch-action: none; }
    .wheel-container.grabbing { cursor: grabbing; }
    .pointer {
      position: absolute; top: 50%; left: calc(100% + 5px); transform: translateY(-50%) scaleX(-1);
      width: 0; height: 0; border-top: 15px solid transparent; border-bottom: 15px solid transparent;
      border-left: 20px solid #333; pointer-events: none;
    }
    #wheelCanvas { display: block; width: 100%; height: 100%; }

    .controls-row { margin-top: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    input[type="text"], input[type="number"], button {
      height: 36px; font-size: 14px; line-height: 14px; padding: 0 12px;
      box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; background-color: #f8f8f8; cursor: pointer;
    }
    input[type="text"], input[type="number"] { cursor: text; background-color: #fff; }
    input::placeholder { color: #999; }
    #winnerDisplay { margin-top: 10px; font-weight: bold; min-height: 24px; }

    .items-section { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; width: 100%; min-height: 0; margin-top: 16px; }
    .add-item-container { width: 900px; max-width: 95%; margin: 0 auto 10px; }
    .form-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) 120px 120px; gap: 10px; align-items: center; }
    .item-list-container {
      flex: 1 1 auto; min-height: 0; width: 900px; max-width: 95%;
      position: relative; border: 1px solid #ccc; border-radius: 4px; padding: 10px;
      overflow-y: auto; overflow-x: hidden; background: #fff;
    }
    .item-list-container::-webkit-scrollbar{ display:none } 
    .item-list-container{ -ms-overflow-style:none; scrollbar-width:none; }
    .item-row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) 120px 120px; gap: 10px; align-items: center; margin-bottom: 8px; width: 100%; }
    .delete-btn { background-color: #f8f8f8; }

    @media (max-width: 900px) {
      .shell { display: block; overflow: auto; }
      html, body { overflow: auto; height: auto; }
      .sidebar { width: 100%; border: 0; }
      .content { height: auto; }
      .wheel-container { width: min(70vw, 500px); height: min(70vw, 500px); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <!-- LEFT: Datasets -->
    <aside class="sidebar left">
      <div class="datasets-header">
        <h3>Datasets</h3>
        <span class="badge" id="activeDatasetBadge">Active: —</span>
      </div>

      <div class="sidebar-scroll">
        <div class="datasets-content">
          <div id="datasetList"></div>
        </div>
      </div>

      <!-- Footer: Add + Import (same style) -->
      <div class="sidebar-footer">
        <div class="footer-row">
          <button class="footer-btn" type="button" onclick="addDataset()">+ Add Dataset</button>
          <label class="footer-btn" title="Import dataset JSON">
            Import
            <input type="file" accept=".json" onchange="importData(event)" />
          </label>
        </div>
      </div>
    </aside>

    <!-- CENTER: Wheel + Items -->
    <main class="content">
      <div class="center-inner">
        <section class="wheel-section">
          <div class="wheel-container" id="wheelContainer">
            <canvas id="wheelCanvas"></canvas>
            <div class="pointer"></div>
          </div>

          <div class="controls-row">
            <button onclick="spinWheel()">Spin</button>
            <input type="text" id="filterTags" placeholder="Filter tags..." style="width:180px;" />
            <button type="button" onclick="applyFilter()">Filter</button>
            <button type="button" onclick="clearFilter()">Clear</button>
          </div>
          <div id="winnerDisplay"></div>
        </section>

        <section class="items-section">
          <div class="add-item-container">
            <form class="form-grid" onsubmit="return false;">
              <input type="text" id="newItemName" placeholder="Enter item name..." />
              <input type="text" id="newItemTags" placeholder="Enter comma-separated tags..." />
              <input type="number" id="newItemWeight" placeholder="Weight (default 1)" min="0.0001" step="0.01" />
              <button type="button" onclick="addItem()">Add Item</button>
            </form>
          </div>
          <div class="item-list-container">
            <div class="item-list" id="itemList"></div>
          </div>
        </section>
      </div>
    </main>

    <!-- RIGHT: History -->
    <aside class="sidebar right">
      <div class="history-header">
        <h3>History</h3>
        <div class="history-controls">
          <button type="button" onclick="clearHistory()">Clear History</button>
          <button type="button" onclick="exportHistory()">Export</button>
        </div>
      </div>
      <div class="sidebar-scroll">
        <div class="history-content" id="historyContent"></div>
      </div>
    </aside>
  </div>

  <script>
    /************ DATASETS MODEL ************/
    const LS_DATASETS = 'spinWheelDatasets';
    const LS_ACTIVE_DATASET_ID = 'spinWheelActiveDatasetId';
    // Dataset: { id, name, items, currentId, history }

    let datasets = [];
    let activeDatasetId = null;

    const newId = () => (crypto.randomUUID ? crypto.randomUUID() : 'ds_' + Math.random().toString(36).slice(2));

    function saveDatasets() {
      try { localStorage.setItem(LS_DATASETS, JSON.stringify(datasets)); } catch {}
      try { localStorage.setItem(LS_ACTIVE_DATASET_ID, JSON.stringify(activeDatasetId)); } catch {}
    }

    function loadDatasets() {
      const rawDs = localStorage.getItem(LS_DATASETS);
      const rawActive = localStorage.getItem(LS_ACTIVE_DATASET_ID);

      if (rawDs) { try { datasets = JSON.parse(rawDs) || []; } catch { datasets = []; } }
      if (rawActive) { try { activeDatasetId = JSON.parse(rawActive) || null; } catch { activeDatasetId = null; } }

      // Migrate legacy single dataset if present
      const legacyData = localStorage.getItem('spinWheelData');
      const legacyHistory = localStorage.getItem('spinWheelHistory');
      if (!datasets.length && (legacyData || legacyHistory)) {
        let items = []; let currentId = 0; let history = [];
        try { if (legacyData) { const d = JSON.parse(legacyData); items = Array.isArray(d.items) ? d.items : []; currentId = d.currentId || 0; } } catch {}
        try { if (legacyHistory) { const h = JSON.parse(legacyHistory); history = Array.isArray(h) ? h : []; } } catch {}
        const ds = { id: newId(), name: 'Default', items, currentId, history };
        datasets.push(ds); activeDatasetId = ds.id;
        localStorage.removeItem('spinWheelData'); localStorage.removeItem('spinWheelHistory');
        saveDatasets();
      }

      // Ensure at least one dataset exists
      if (!datasets.length) {
        const ds = { id: newId(), name: 'Default', items: [], currentId: 0, history: [] };
        datasets.push(ds); activeDatasetId = ds.id; saveDatasets();
      }

      if (!datasets.find(d => d.id === activeDatasetId)) {
        activeDatasetId = datasets[0].id; saveDatasets();
      }
    }

    function getActiveDataset() { return datasets.find(d => d.id === activeDatasetId); }

    function setActiveDataset(id) {
      const ds = datasets.find(d => d.id === id);
      if (!ds) return;

      activeDatasetId = id;

      items = (ds.items || []).map(it => ({
        id: it.id, name: it.name,
        tags: Array.isArray(it.tags) ? it.tags : [],
        weight: sanitizeWeight(it.weight ?? 1, 1)
      }));
      currentId = Math.max(ds.currentId || 0, items.reduce((m,it)=>Math.max(m, it.id||0), 0) + 1);
      history = Array.isArray(ds.history) ? ds.history : [];

      saveDatasets();
      renderDatasetsList();
      renderHistory();
      renderItemList();
      drawWheel();

      document.getElementById('activeDatasetBadge').textContent = 'Active: ' + (ds.name || '—');
    }

    function updateActiveDatasetSnapshot() {
      const ds = getActiveDataset();
      if (!ds) return;
      ds.items = items;
      ds.currentId = currentId;
      ds.history = history;
      saveDatasets();
      // no forced re-render here to preserve dataset input focus UX
    }

    function addDatasetFromImport(name, imported) {
      const cleanedItems = (imported.items || []).map(it => ({
        id: it.id, name: it.name,
        tags: Array.isArray(it.tags) ? it.tags : [],
        weight: sanitizeWeight(it.weight ?? 1, 1)
      }));
      const maxId = cleanedItems.reduce((m, it) => Math.max(m, it.id || 0), 0);
      const ds = {
        id: newId(),
        name: name || 'Imported',
        items: cleanedItems,
        currentId: Math.max(imported.currentId || 0, maxId + 1),
        history: []
      };
      datasets.unshift(ds);
      activeDatasetId = ds.id;
      saveDatasets();
      setActiveDataset(ds.id);
      renderDatasetsList();
    }

    /* Inline rename without re-render (prevents focus loss) */
    function renameDatasetInline(id, newName) {
      const ds = datasets.find(d => d.id === id);
      if (!ds) return;
      ds.name = newName || 'Untitled';
      saveDatasets();
      if (id === activeDatasetId) {
        document.getElementById('activeDatasetBadge').textContent = 'Active: ' + ds.name;
      }
    }

    function addDataset() {
      const index = datasets.length + 1;
      const ds = { id: newId(), name: `Dataset ${index}`, items: [], currentId: 0, history: [] };
      datasets.unshift(ds);
      saveDatasets();
      setActiveDataset(ds.id);
      renderDatasetsList();
      setTimeout(() => {
        const input = document.querySelector(`.dataset-name[data-dsid="${ds.id}"]`);
        if (input) { input.focus(); input.select(); }
      }, 0);
    }

    function exportDataset(dsId) {
      const ds = datasets.find(d => d.id === dsId);
      if (!ds) return;
      const payload = { currentId: ds.currentId || 0, items: ds.items || [] };
      const dataStr = JSON.stringify(payload, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${(ds.name || 'dataset').replace(/[^\w\-]+/g,'_')}.json`;
      link.click();
      URL.revokeObjectURL(url);
      if (dsId === activeDatasetId) pushHistory('export_items', { itemCount: (ds.items || []).length });
    }

    function deleteDataset(dsId) {
      const ds = datasets.find(d => d.id === dsId);
      if (!ds) return;
      const step1 = confirm(`Delete dataset "${ds.name}"?`);
      if (!step1) return;
      const step2 = confirm('This will remove the dataset and its items/history from this browser. Continue?');
      if (!step2) return;

      datasets = datasets.filter(d => d.id !== dsId);

      if (!datasets.length) {
        const fallback = { id: newId(), name: 'Default', items: [], currentId: 0, history: [] };
        datasets.push(fallback);
      }

      if (activeDatasetId === dsId) {
        activeDatasetId = datasets[0].id;
        saveDatasets();
        setActiveDataset(activeDatasetId);
      } else {
        saveDatasets();
        renderDatasetsList();
      }
    }

    function renderDatasetsList() {
      const listEl = document.getElementById('datasetList');
      listEl.innerHTML = '';

      datasets.forEach(ds => {
        const row = document.createElement('div');
        row.className = 'dataset-row' + (ds.id === activeDatasetId ? ' active' : '');

        /* Top row: Name (inline-edit, no re-render on input) */
        const top = document.createElement('div');
        top.className = 'dataset-top';
        const nameInput = document.createElement('input');
        nameInput.className = 'dataset-name';
        nameInput.value = ds.name || 'Untitled';
        nameInput.setAttribute('data-dsid', ds.id);
        nameInput.addEventListener('input', () => renameDatasetInline(ds.id, nameInput.value));
        nameInput.addEventListener('blur', () => renderDatasetsList());
        top.appendChild(nameInput);

        /* Bottom row: 4 equal columns (Info • Apply • Export • Delete) */
        const bottom = document.createElement('div');
        bottom.className = 'dataset-bottom';

        const infoWrap = document.createElement('div');
        infoWrap.className = 'dataset-cell';
        const info = document.createElement('span');
        info.className = 'dataset-info';
        info.setAttribute('data-dsid', ds.id);            /* tag for live updates */
        const itemCount = (ds.items || []).length;
        info.textContent = `${itemCount} items`;
        infoWrap.appendChild(info);

        const applyWrap = document.createElement('div');
        applyWrap.className = 'dataset-cell';
        const applyBtn = document.createElement('button');
        applyBtn.className = 'btn primary';
        applyBtn.textContent = (ds.id === activeDatasetId) ? 'Applied' : 'Apply';
        applyBtn.disabled = (ds.id === activeDatasetId);
        applyBtn.onclick = () => setActiveDataset(ds.id);
        applyWrap.appendChild(applyBtn);

        const exportWrap = document.createElement('div');
        exportWrap.className = 'dataset-cell';
        const exportBtn = document.createElement('button');
        exportBtn.className = 'btn';
        exportBtn.textContent = 'Export';
        exportBtn.title = 'Export items JSON';
        exportBtn.onclick = () => exportDataset(ds.id);
        exportWrap.appendChild(exportBtn);

        const deleteWrap = document.createElement('div');
        deleteWrap.className = 'dataset-cell';
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn danger';
        deleteBtn.textContent = 'Delete';
        deleteBtn.title = 'Delete this dataset';
        deleteBtn.onclick = () => deleteDataset(ds.id);
        deleteWrap.appendChild(deleteBtn);

        bottom.appendChild(infoWrap);
        bottom.appendChild(applyWrap);
        bottom.appendChild(exportWrap);
        bottom.appendChild(deleteWrap);

        row.appendChild(top);
        row.appendChild(bottom);
        listEl.appendChild(row);
      });
    }

    /************ APP STATE ************/
    let items = [];
    let currentId = 0;
    let activeFilterTags = [];
    let history = [];

    const wheelContainer = document.getElementById('wheelContainer');
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');

    // rotation/animation
    let rotationAngle = 0;     // radians
    let spinVelocity = 0;      // rad/s
    let spinning = false;

    // RAF & suppression
    let rafId = null;
    let suppressPick = false;

    // drag/flick
    let isDragging = false;
    let lastPointerAngle = null;
    let velocitySamples = []; // {t,dAngle}
    const VELOCITY_WINDOW_MS = 120;
    const MOVE_EPS = 0.01;
    const HOLD_TO_CANCEL_MS = 120;
    let lastSignificantMoveTs = 0;
    let wasSpinningBeforeDrag = false;

    // physics
    const DECAY_PER_SECOND = 0.55;
    const MIN_VELOCITY_RAD_S = 0.05;
    const BUTTON_START_V_RAD_S = 8.0;

    const historyContentEl = document.getElementById('historyContent');

    /************ INIT ************/
    loadDatasets();
    setActiveDataset(activeDatasetId);

    adjustCanvasSize(); drawWheel(); renderItemList(); renderHistory(); renderDatasetsList();
    window.addEventListener('resize', () => { adjustCanvasSize(); drawWheel(); });
    function adjustCanvasSize() {
      const rect = wheelContainer.getBoundingClientRect();
      canvas.width = rect.width; canvas.height = rect.height;
    }

    /************ UTILS ************/
    const nowStr = () => new Date().toLocaleString();
    function pushHistory(type, payload = {}) {
      history.unshift({ id: crypto.randomUUID?.() ?? String(Math.random()), time: nowStr(), type, payload });
      updateActiveDatasetSnapshot();
      renderHistory();
    }
    function sanitizeWeight(val, fallback = 1) { let w = Number(val); if (!isFinite(w) || w <= 0) w = fallback; return w; }
    function getPointerAngle(evt) {
      const rect = canvas.getBoundingClientRect();
      const x = (evt.clientX ?? evt.touches?.[0]?.clientX) - rect.left;
      const y = (evt.clientY ?? evt.touches?.[0]?.clientY) - rect.top;
      const cx = canvas.width / 2, cy = canvas.height / 2;
      return Math.atan2(y - cy, x - cx);
    }
    function normAngleDelta(d) { while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI; return d; }

    /* Live-update the active dataset's info pill without re-rendering the list */
    function refreshActiveDatasetInfoPill() {
      const el = document.querySelector(`.dataset-info[data-dsid="${activeDatasetId}"]`);
      if (el) el.textContent = `${items.length} items`;
    }

    /************ Items ************/
    function addItem() {
      const nameInput = document.getElementById('newItemName');
      const tagsInput = document.getElementById('newItemTags');
      const weightInput = document.getElementById('newItemWeight');

      const name = nameInput.value.trim();
      if (!name) { alert("Item name cannot be empty."); return; }

      const tags = tagsInput.value.split(',').map(t => t.trim()).filter(Boolean);
      const weight = sanitizeWeight(weightInput.value || 1, 1);

      const newItem = { id: currentId++, name, tags, weight };
      items.push(newItem);

      nameInput.value = ''; tagsInput.value = ''; weightInput.value = '';
      updateActiveDatasetSnapshot(); renderItemList(); drawWheel();

      refreshActiveDatasetInfoPill(); /* live count */
      pushHistory('add_item', { name: newItem.name, tags: newItem.tags, weight: newItem.weight });
    }
    function updateItemName(id, newName) {
      const idx = items.findIndex(i => i.id === id);
      if (idx !== -1) {
        const oldName = items[idx].name;
        items[idx].name = newName;
        updateActiveDatasetSnapshot(); drawWheel();
        if (oldName !== newName) pushHistory('rename_item', { from: oldName, to: newName });
      }
    }
    function updateItemTags(id, tagsString) {
      const newTags = tagsString.split(',').map(t => t.trim()).filter(Boolean);
      const idx = items.findIndex(i => i.id === id);
      if (idx !== -1) {
        items[idx].tags = newTags;
        updateActiveDatasetSnapshot(); drawWheel();
        pushHistory('update_tags', { name: items[idx].name, tags: newTags });
      }
    }
    function updateItemWeight(id, weightVal) {
      const idx = items.findIndex(i => i.id === id);
      if (idx !== -1) {
        const oldW = items[idx].weight ?? 1;
        const w = sanitizeWeight(weightVal, oldW || 1);
        items[idx].weight = w;
        updateActiveDatasetSnapshot(); drawWheel();
        if (w !== oldW) pushHistory('update_weight', { name: items[idx].name, from: oldW, to: w });
      }
    }
    function deleteItem(id) {
      const item = items.find(i => i.id === id);
      items = items.filter(i => i.id !== id);
      updateActiveDatasetSnapshot(); renderItemList(); drawWheel();

      refreshActiveDatasetInfoPill(); /* live count */
      pushHistory('delete_item', { name: item ? item.name : '(unknown)' });
    }

    /************ Filter ************/
    function applyFilter() {
      const v = document.getElementById('filterTags').value.trim();
      activeFilterTags = v ? v.split(',').map(t => t.trim()).filter(Boolean) : [];
      renderItemList(); drawWheel();
    }
    function clearFilter() {
      activeFilterTags = []; document.getElementById('filterTags').value = '';
      renderItemList(); drawWheel();
    }
    function matchesFilter(item) {
      if (!activeFilterTags.length) return true;
      return activeFilterTags.every(t => item.tags.includes(t));
    }

    /************ Render list ************/
    function renderItemList() {
      const el = document.getElementById('itemList'); el.innerHTML = '';
      items.forEach(item => {
        if (!matchesFilter(item)) return;
        const row = document.createElement('div'); row.className = 'item-row';

        const nameInput = document.createElement('input');
        nameInput.type = 'text'; nameInput.placeholder = 'Item name...';
        nameInput.value = item.name; nameInput.oninput = () => updateItemName(item.id, nameInput.value);

        const tagsInput = document.createElement('input');
        tagsInput.type = 'text'; tagsInput.placeholder = 'Tags...';
        tagsInput.value = (item.tags || []).join(', '); tagsInput.oninput = () => updateItemTags(item.id, tagsInput.value);

        const weightInput = document.createElement('input');
        weightInput.type = 'number'; weightInput.placeholder = 'Weight';
        weightInput.min = '0.0001'; weightInput.step = '0.01';
        weightInput.value = (item.weight ?? 1); weightInput.oninput = () => updateItemWeight(item.id, weightInput.value);

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn'; delBtn.textContent = 'Delete';
        delBtn.onclick = () => deleteItem(item.id);

        row.appendChild(nameInput); row.appendChild(tagsInput); row.appendChild(weightInput); row.appendChild(delBtn);
        el.appendChild(row);
      });
    }

    /************ Drawing (weighted wheel) ************/
    function drawWheel() {
      const visibleItems = items.filter(matchesFilter);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2, cy = canvas.height / 2;
      const radius = Math.min(canvas.width, canvas.height) / 2 - 2;

      if (!visibleItems.length) {
        ctx.beginPath(); ctx.arc(cx, cy, radius, 0, 2*Math.PI); ctx.fillStyle = '#eee'; ctx.fill();
        ctx.textAlign = 'center'; ctx.fillStyle = '#666'; ctx.font = '20px Arial'; ctx.fillText('No Items', cx, cy);
        return;
      }

      const weights = visibleItems.map(i => sanitizeWeight(i.weight ?? 1, 1));
      const totalWeight = weights.reduce((a,b)=>a+b, 0); if (totalWeight <= 0) return;

      let start = rotationAngle;
      for (let i = 0; i < visibleItems.length; i++) {
        const span = (2*Math.PI) * (weights[i] / totalWeight);
        const startAngle = start, endAngle = start + span;

        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, startAngle, endAngle);
        ctx.fillStyle = getSegmentColor(i, visibleItems.length); ctx.fill(); ctx.stroke();

        const mid = (startAngle + endAngle) / 2;
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(mid);
        ctx.textAlign = 'left'; ctx.fillStyle = '#000'; ctx.font = '14px Arial';
        ctx.fillText(visibleItems[i].name, radius - 70, 5);
        ctx.restore();

        start += span;
      }
    }
    function getSegmentColor(i, total) { const hue = (360 / total) * i; return `hsl(${hue}, 60%, 70%)`; }

    /************ Spinning (time-based inertia) ************/
    let lastAnimTime = null;
    function animateSpin(ts) {
      if (!spinning) { rafId = null; return; }
      if (lastAnimTime == null) { lastAnimTime = ts; rafId = requestAnimationFrame(animateSpin); return; }

      const dt = Math.max(0, (ts - lastAnimTime) / 1000);
      lastAnimTime = ts;

      rotationAngle = (rotationAngle + spinVelocity * dt) % (2*Math.PI);
      const decay = Math.pow(DECAY_PER_SECOND, dt);
      spinVelocity *= decay;

      drawWheel();

      if (Math.abs(spinVelocity) > 0.05) {
        rafId = requestAnimationFrame(animateSpin);
      } else {
        spinning = false; spinVelocity = 0; lastAnimTime = null; rafId = null;
        if (!suppressPick) pickWinner();
        suppressPick = false;
      }
    }

    function spinWheel() {
      const visibleItems = items.filter(matchesFilter);
      if (!visibleItems.length) { alert("No items to spin!"); return; }
      if (spinning) return;

      suppressPick = false; spinning = true;
      document.getElementById('winnerDisplay').textContent = "";

      rotationAngle = Math.random() * 2 * Math.PI;
      spinVelocity = 8.0; /* start speed */
      lastAnimTime = null;
      rafId = requestAnimationFrame(animateSpin);
    }

    /************ Winner (weighted mapping) ************/
    function pickWinner() {
      const visibleItems = items.filter(matchesFilter);
      const winnerDisplay = document.getElementById('winnerDisplay');
      if (!visibleItems.length) { winnerDisplay.textContent = "No winner (no items)"; return; }

      const weights = visibleItems.map(i => sanitizeWeight(i.weight ?? 1, 1));
      const totalWeight = weights.reduce((a,b)=>a+b, 0);

      let localAngle = (-rotationAngle % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);

      let cum = 0, idx = 0;
      for (let i = 0; i < visibleItems.length; i++) {
        const span = (2*Math.PI) * (weights[i] / totalWeight);
        if (localAngle >= cum && localAngle < cum + span) { idx = i; break; }
        cum += span;
      }

      const winner = visibleItems[idx];
      winnerDisplay.textContent = `Winner: ${winner.name}`;
      pushHistory('spin', {
        winner: winner.name,
        weight: sanitizeWeight(winner.weight ?? 1, 1),
        tags: [...(winner.tags || [])],
        filteredBy: [...activeFilterTags],
        poolCount: visibleItems.length,
        totalWeight: totalWeight
      });
    }

    /************ Drag / Flick (cancel-on-hold + speed gating) ************/
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      wasSpinningBeforeDrag = spinning;

      if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
      if (wasSpinningBeforeDrag) suppressPick = true;

      spinning = false; spinVelocity = 0; lastAnimTime = null;

      isDragging = true; velocitySamples = [];
      lastPointerAngle = getPointerAngle(e);
      lastSignificantMoveTs = performance.now();
      wheelContainer.classList.add('grabbing');
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      e.preventDefault();

      const ang = getPointerAngle(e);
      if (lastPointerAngle == null) { lastPointerAngle = ang; return; }

      let d = normAngleDelta(ang - lastPointerAngle);
      rotationAngle = (rotationAngle + d) % (2 * Math.PI);
      drawWheel();

      const now = performance.now();
      if (Math.abs(d) >= 0.01) lastSignificantMoveTs = now;

      velocitySamples.push({ t: now, dAngle: d });
      const cutoff = now - 120;
      while (velocitySamples.length && velocitySamples[0].t < cutoff) velocitySamples.shift();

      lastPointerAngle = ang;
    });

    function endDrag(e) {
      if (!isDragging) return;
      e && e.preventDefault();

      isDragging = false;
      wheelContainer.classList.remove('grabbing');
      lastPointerAngle = null;

      const now = performance.now();
      const heldLongEnough = (now - lastSignificantMoveTs) >= 120;

      if (!velocitySamples.length) {
        if (wasSpinningBeforeDrag) { suppressPick = false; pickWinner(); }
        return;
      }

      const firstT = velocitySamples[0].t;
      const lastT  = velocitySamples[velocitySamples.length - 1].t;
      const totalMs = Math.max(1, lastT - firstT);
      const netAngle = velocitySamples.reduce((s, smp) => s + smp.dAngle, 0);
      const vWindow = (netAngle / totalMs) * 1000; // rad/s

      let vInstant = 0;
      if (velocitySamples.length >= 2) {
        const a = velocitySamples[velocitySamples.length - 2];
        const b = velocitySamples[velocitySamples.length - 1];
        const dt = Math.max(1, b.t - a.t);
        vInstant = (b.dAngle / dt) * 1000;
      } else { vInstant = vWindow; }

      // Cancel if held and not moving fast
      if (!wasSpinningBeforeDrag && heldLongEnough && Math.abs(vInstant) < 0.25) return;
      if (wasSpinningBeforeDrag && heldLongEnough && Math.abs(vInstant) < 0.25) { suppressPick = false; pickWinner(); return; }

      const shouldStartInertia = (Math.abs(vInstant) >= 0.50) && (Math.abs(vWindow) >= 0.50);

      if (!shouldStartInertia) {
        if (wasSpinningBeforeDrag) { suppressPick = false; pickWinner(); }
        return;
      }

      suppressPick = false;
      spinVelocity = vWindow;
      spinning = true;
      document.getElementById('winnerDisplay').textContent = "";
      lastAnimTime = null;
      rafId = requestAnimationFrame(animateSpin);
    }

    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('pointerleave', (e) => {
      if (isDragging && !canvas.hasPointerCapture?.(e.pointerId)) endDrag(e);
    });

    /************ Import (footer) ************/
    function importData(event) {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported && Array.isArray(imported.items)) {
            const base = (file.name || 'Imported').replace(/\.[^/.]+$/, '');
            addDatasetFromImport(base, imported);
            pushHistory('import_items', { itemCount: imported.items.length, fileName: file.name });
          } else {
            alert("Invalid JSON format for items.");
          }
        } catch (err) {
          alert("Failed to parse JSON file."); console.error(err);
        }
      };
      reader.readAsText(file); event.target.value = "";
    }

    /************ History (per dataset) ************/
    function clearHistory() {
      if (!confirm('Clear the entire history panel for this dataset?')) return;
      history = [];
      updateActiveDatasetSnapshot();
      renderHistory();
    }
    function exportHistory() {
      const dataStr = JSON.stringify(history, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a'); link.href = url; link.download = 'spinWheelHistory.json'; link.click();
      URL.revokeObjectURL(url);
    }
    function renderHistory() {
      historyContentEl.innerHTML = '';
      if (!history.length) {
        const empty = document.createElement('div'); empty.style.color = '#666'; empty.style.fontSize = '13px'; empty.textContent = 'No history yet.';
        historyContentEl.appendChild(empty); return;
      }
      history.forEach(entry => {
        const div = document.createElement('div'); div.className = 'history-item';
        let title = '', details = '';
        switch (entry.type) {
          case 'spin':
            title = `🎯 Winner: ${entry.payload.winner}`;
            details = `Total weight: ${Number(entry.payload.totalWeight).toFixed(2)} • Pool: ${entry.payload.poolCount}`;
            if (entry.payload.filteredBy?.length) details += ` • Filter: ${entry.payload.filteredBy.join(', ')}`;
            if (entry.payload.weight != null) details += ` • Winner weight: ${entry.payload.weight}`;
            if (entry.payload.tags?.length) details += ` • Tags: ${entry.payload.tags.join(', ')}`;
            break;
          case 'add_item':
            title = `➕ Added: ${entry.payload.name}`;
            details = `Weight: ${entry.payload.weight}` + (entry.payload.tags?.length ? ` • Tags: ${entry.payload.tags.join(', ')}` : '');
            break;
          case 'rename_item':
            title = `✏️ Renamed`; details = `${entry.payload.from} → ${entry.payload.to}`; break;
          case 'update_tags':
            title = `🏷️ Updated Tags: ${entry.payload.name}`;
            details = (entry.payload.tags && entry.payload.tags.length) ? entry.payload.tags.join(', ') : '—'; break;
          case 'update_weight':
            title = `⚖️ Updated Weight: ${entry.payload.name}`;
            details = `${entry.payload.from} → ${entry.payload.to}`; break;
          case 'delete_item':
            title = `🗑️ Deleted: ${entry.payload.name}`; break;
          case 'import_items':
            title = `📥 Imported Items`;
            details = `${entry.payload.itemCount ?? 0} items` + (entry.payload.fileName ? ` • ${entry.payload.fileName}` : ''); break;
          case 'export_items':
            title = `📤 Exported Items`; details = `${entry.payload.itemCount ?? 0} items`; break;
          case 'clear_items':
            title = `⚠️ Cleared All Items`; details = 'All current items removed'; break;
          default: title = entry.type;
        }
        const titleEl = document.createElement('div'); titleEl.textContent = title; div.appendChild(titleEl);
        if (details) { const detailsEl = document.createElement('div'); detailsEl.style.color = '#444'; detailsEl.style.marginTop = '2px'; detailsEl.textContent = details; div.appendChild(detailsEl); }
        const timeEl = document.createElement('div'); timeEl.className = 'time'; timeEl.textContent = entry.time; div.appendChild(timeEl);
        historyContentEl.appendChild(div);
      });
    }

    /* helper for segment color */
    function getSegmentColor(i, total) { const hue = (360 / total) * i; return `hsl(${hue}, 60%, 70%)`; }
  </script>
</body>
